
<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Trebuchet MS, Verdana, sans-serif">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F3E7C9"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Outer Card Background -->
  <rect x="0" y="0" width="1200" height="680" rx="28" fill="url(#bgGrad)"/>

  <!-- ================= HEADER SECTION (LEFT SIDE) ================= -->
  <g transform="translate(60, 260)">
    <text x="0" y="0" font-size="46" font-weight="bold" fill="#3A2E20">🎲 GitHub Ludo Stats</text>
    <text x="0" y="52" font-size="28" font-weight="600" fill="#3A2E20" opacity="0.85">@sathya-off</text>
    <text x="0" y="90" font-size="18" font-style="italic" fill="#3A2E20" opacity="0.65">Budding Engineer, Exploring the Future World</text>
  </g>

  <!-- ================= LUDO BOARD SECTION (MOVED TO RIGHT CORNER) ================= -->
  <!-- Board Coordinates: Origin (560, 40), Total Width: 600, Height: 600 -->
  <g transform="translate(560, 40)">
    <!-- Wooden Border -->
    <rect x="0" y="0" width="600" height="600" rx="24" fill="#8B5E34" filter="url(#softShadow)"/>
    <!-- Inner Board Background -->
    <rect x="10" y="10" width="580" height="580" rx="16" fill="#FBF2DD"/>

    <!-- ---------------- HOUSES / HOME BASES ---------------- -->
    <!-- Red House (Top-Left) -->
    <g transform="translate(10, 10)">
      <rect x="0" y="0" width="232" height="232" rx="16" fill="#E63946"/>
      <rect x="36" y="36" width="160" height="160" rx="16" fill="#FFFFFF" stroke="#E63946" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="76" cy="66" r="9" fill="#E63946"/>
      <circle cx="156" cy="66" r="9" fill="#E63946"/>
      <text x="116" y="132" text-anchor="middle" font-size="44" font-weight="bold" fill="#3A2E20">8</text>
      <text x="116" y="162" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#E63946">🧩 REPOSITORIES</text>
    </g>

    <!-- Green House (Top-Right) -->
    <g transform="translate(358, 10)">
      <rect x="0" y="0" width="232" height="232" rx="16" fill="#2E9E5B"/>
      <rect x="36" y="36" width="160" height="160" rx="16" fill="#FFFFFF" stroke="#2E9E5B" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="76" cy="66" r="9" fill="#2E9E5B"/>
      <circle cx="156" cy="66" r="9" fill="#2E9E5B"/>
      <text x="116" y="132" text-anchor="middle" font-size="44" font-weight="bold" fill="#3A2E20">15</text>
      <text x="116" y="162" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#2E9E5B">🤝 FOLLOWERS</text>
    </g>

    <!-- Blue House (Bottom-Left) -->
    <g transform="translate(10, 358)">
      <rect x="0" y="0" width="232" height="232" rx="16" fill="#3866D6"/>
      <rect x="36" y="36" width="160" height="160" rx="16" fill="#FFFFFF" stroke="#3866D6" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="76" cy="66" r="9" fill="#3866D6"/>
      <circle cx="156" cy="66" r="9" fill="#3866D6"/>
      <text x="116" y="132" text-anchor="middle" font-size="44" font-weight="bold" fill="#3A2E20">5</text>
      <text x="116" y="162" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#3866D6">🔥 STREAK</text>
    </g>

    <!-- Yellow House (Bottom-Right) -->
    <g transform="translate(358, 358)">
      <rect x="0" y="0" width="232" height="232" rx="16" fill="#F0B429"/>
      <rect x="36" y="36" width="160" height="160" rx="16" fill="#FFFFFF" stroke="#F0B429" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="76" cy="66" r="9" fill="#F0B429"/>
      <circle cx="156" cy="66" r="9" fill="#F0B429"/>
      <text x="116" y="132" text-anchor="middle" font-size="44" font-weight="bold" fill="#3A2E20">107</text>
      <text x="116" y="162" text-anchor="middle" font-size="12" font-weight="bold" letter-spacing="0.5" fill="#F0B429">⚡ CONTRIBUTIONS</text>
    </g>

    <!-- ---------------- TRACK PATHWAYS ---------------- -->
    <!-- Top Track (Green Home Path) -->
    <g transform="translate(242, 10)">
      <rect x="0" y="0" width="116" height="232" fill="#FFFFFF" stroke="#E4D3AE" stroke-width="1.5"/>
      <rect x="38.66" y="38.66" width="38.66" height="193.34" fill="#2E9E5B" opacity="0.6"/>
      <rect x="77.32" y="38.66" width="38.66" height="38.66" fill="#2E9E5B" opacity="0.3"/>
      <circle cx="96.65" cy="58" r="12" fill="none" stroke="#2E9E5B" stroke-width="2"/>
      <text x="96.65" y="63" text-anchor="middle" font-size="12" fill="#2E9E5B">★</text>
    </g>

    <!-- Bottom Track (Blue Home Path) -->
    <g transform="translate(242, 358)">
      <rect x="0" y="0" width="116" height="232" fill="#FFFFFF" stroke="#E4D3AE" stroke-width="1.5"/>
      <rect x="38.66" y="0" width="38.66" height="193.34" fill="#3866D6" opacity="0.6"/>
      <rect x="0" y="154.66" width="38.66" height="38.66" fill="#3866D6" opacity="0.3"/>
      <circle cx="19.33" cy="174" r="12" fill="none" stroke="#3866D6" stroke-width="2"/>
      <text x="19.33" y="179" text-anchor="middle" font-size="12" fill="#3866D6">★</text>
    </g>

    <!-- Left Track (Red Home Path) -->
    <g transform="translate(10, 242)">
      <rect x="0" y="0" width="232" height="116" fill="#FFFFFF" stroke="#E4D3AE" stroke-width="1.5"/>
      <rect x="38.66" y="38.66" width="193.34" height="38.66" fill="#E63946" opacity="0.6"/>
      <rect x="38.66" y="0" width="38.66" height="38.66" fill="#E63946" opacity="0.3"/>
      <circle cx="58" cy="19.33" r="12" fill="none" stroke="#E63946" stroke-width="2"/>
      <text x="58" y="24.33" text-anchor="middle" font-size="12" fill="#E63946">★</text>
    </g>

    <!-- Right Track (Yellow Home Path) -->
    <g transform="translate(358, 242)">
      <rect x="0" y="0" width="232" height="116" fill="#FFFFFF" stroke="#E4D3AE" stroke-width="1.5"/>
      <rect x="0" y="38.66" width="193.34" height="38.66" fill="#F0B429" opacity="0.6"/>
      <rect x="154.66" y="77.32" width="38.66" height="38.66" fill="#F0B429" opacity="0.3"/>
      <circle cx="174" cy="96.65" r="12" fill="none" stroke="#F0B429" stroke-width="2"/>
      <text x="174" y="101.65" text-anchor="middle" font-size="12" fill="#F0B429">★</text>
    </g>

    <!-- Track Grid Lines OVERLAY -->
    <path d="
      M 242,48.66 H 358 M 242,87.32 H 358 M 242,126 H 358 M 242,164.66 H 358 M 242,203.32 H 358
      M 280.66,10 V 242 M 319.32,10 V 242
      M 242,396.66 H 358 M 242,435.32 H 358 M 242,474 H 358 M 242,512.66 H 358 M 242,551.32 H 358
      M 280.66,358 V 590 M 319.32,358 V 590
      M 48.66,242 V 358 M 87.32,242 V 358 M 126,242 V 358 M 164.66,242 V 358 M 203.32,242 V 358
      M 10,280.66 H 242 M 10,319.32 H 242
      M 396.66,242 V 358 M 435.32,242 V 358 M 474,242 V 358 M 512.66,242 V 358 M 551.32,242 V 358
      M 358,280.66 H 590 M 358,319.32 H 590
    " stroke="#E4D3AE" stroke-width="1.5" fill="none"/>

    <!-- ---------------- CENTER WINNING TRIANGLES ---------------- -->
    <g transform="translate(242, 242)">
      <polygon points="0,0 116,0 58,58" fill="#2E9E5B"/>
      <polygon points="116,0 116,116 58,58" fill="#F0B429"/>
      <polygon points="116,116 0,116 58,58" fill="#3866D6"/>
      <polygon points="0,116 0,0 58,58" fill="#E63946"/>
      
      <!-- Trophy Emblem -->
      <circle cx="58" cy="58" r="24" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="58" cy="58" r="18" fill="#FFF7E0" stroke="#3A2E20" stroke-width="1.5"/>
      <text x="58" y="64" text-anchor="middle" font-size="18">🏆</text>
    </g>

    <!-- ---------------- ANIMATED MOVING TOKENS ---------------- -->
    <path id="ludoPath" d="
      M 261.33,261.33 
      L 48.66,261.33 
      A 19.33,19.33 0 0 1 48.66,299.99 
      L 261.33,299.99 
      L 261.33,551.33 
      A 19.33,19.33 0 0 0 299.99,551.33 
      L 299.99,299.99 
      L 551.33,299.99 
      A 19.33,19.33 0 0 0 551.33,261.33 
      L 299.99,261.33 
      L 299.99,48.66 
      A 19.33,19.33 0 0 0 261.33,48.66 
      Z" fill="none" stroke="none"/>

    <circle r="9" fill="#E63946" stroke="#FFFFFF" stroke-width="2" filter="url(#softShadow)">
      <animateMotion dur="14s" begin="0s" repeatCount="indefinite" rotate="0">
        <mpath xlink:href="#ludoPath"/>
      </animateMotion>
    </circle>

    <circle r="9" fill="#F0B429" stroke="#FFFFFF" stroke-width="2" filter="url(#softShadow)">
      <animateMotion dur="14s" begin="-7s" repeatCount="indefinite" rotate="0">
        <mpath xlink:href="#ludoPath"/>
      </animateMotion>
    </circle>
  </g>
</svg>
